<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>公主英文城堡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Bpmf+Huninn&display=swap">
<style>
/* Layout: one storybook stage card floating over a pastel castle sky; big touch targets for a first grader on a tablet. */
:root {
  --sky-top: #FCE4F1;
  --sky-bottom: #E6DBFA;
  --paper: #FFFBFD;
  --ink: #4A2B4F;
  --ink-soft: #7A5C80;
  --rose: #F49AC1;
  --berry: #C2407A;
  --lilac: #B9A2EE;
  --gold: #F4C24D;
  --gold-deep: #D99A12;
  --mint: #7FD8B5;
  --line: #EBD3E5;
  --shadow: 0 6px 0 #E7C6DC;
  --font-en: 'Fredoka', 'Bpmf Huninn', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
  --font-zh: 'Bpmf Huninn', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom)) fixed;
  color: var(--ink);
  font-family: var(--font-en);
  font-size: 20px;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 32px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 100%;
  box-sizing: border-box;
}
.zh { font-family: var(--font-zh); line-height: 1.7; letter-spacing: .02em; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 4px solid var(--lilac); outline-offset: 3px; }

/* top bar */
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar .spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--paper); border: 3px solid var(--line); border-radius: 999px;
  padding: 6px 14px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.iconbtn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--paper); border: 3px solid var(--line); border-radius: 18px;
  padding: 8px 14px; font-weight: 600; min-height: 52px; box-shadow: var(--shadow);
}
.iconbtn:active { transform: translateY(3px); box-shadow: 0 3px 0 #E7C6DC; }

/* stage card */
.card {
  background: var(--paper);
  border: 4px solid var(--line);
  border-radius: 32px;
  padding: 22px clamp(14px, 3vw, 32px) 26px;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  box-shadow: 0 10px 0 #E7C6DC;
  position: relative;
}
.title-zh { font-size: 30px; font-weight: 400; text-align: center; margin: 0; text-wrap: balance; }
.say-zh { display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap; text-align: center; font-size: 24px; }
.spk {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--lilac); color: #fff; font-size: 24px;
  display: inline-grid; place-items: center; flex: none; box-shadow: 0 4px 0 #9A83D6;
}
.spk:active { transform: translateY(3px); box-shadow: 0 1px 0 #9A83D6; }

.btn {
  min-height: 64px; padding: 10px 26px; border-radius: 22px;
  font-size: 24px; font-weight: 600;
  background: var(--rose); color: #fff; box-shadow: 0 6px 0 var(--berry);
  display: inline-flex; align-items: center; gap: 10px; justify-content: center;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--berry); }
.btn.gold { background: var(--gold); color: var(--ink); box-shadow: 0 6px 0 var(--gold-deep); }
.btn.gold:active { box-shadow: 0 2px 0 var(--gold-deep); }
.btn.soft { background: var(--paper); color: var(--ink); border: 3px solid var(--line); box-shadow: var(--shadow); }
.btn.mint { background: var(--mint); color: var(--ink); box-shadow: 0 6px 0 #3FAE86; }
.btn.big { min-height: 84px; font-size: 30px; padding: 12px 40px; border-radius: 28px; }
.row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; align-items: center; }

/* bubbles */
.scene { display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%; }
.bubble {
  position: relative; background: #fff; border: 4px solid var(--lilac); border-radius: 28px;
  padding: 14px 22px; font-size: 34px; font-weight: 600; color: var(--ink);
  display: inline-flex; align-items: center; gap: 12px; max-width: 100%;
}
.bubble small { display: block; font-size: 20px; font-weight: 400; color: var(--ink-soft); }

/* princess art */
.princess { height: min(300px, 42vh); width: auto; max-width: 46vw; flex: none; }
.princess.sm { width: 92px; height: auto; }
.princess.lg { height: min(420px, 56vh); }

/* sentence carriage */
.train { display: flex; align-items: flex-end; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 6px 0 14px; }
.train.go { animation: drive 1.6s ease-in-out; }
@keyframes drive { 0% { transform: translateX(0); } 45% { transform: translateX(-12%); } 55% { transform: translateX(-12%) translateY(-6px); } 100% { transform: translateX(0); } }
.horse { font-size: 56px; line-height: 1; margin-right: 4px; }
.car {
  position: relative; min-width: 84px; padding: 14px 18px 18px;
  border-radius: 20px 20px 12px 12px; border: 4px dashed #D9C3D6;
  background: #FFFFFF; color: var(--ink-soft);
  font-size: 34px; font-weight: 600; text-align: center; line-height: 1.1;
  transition: background .25s, color .25s, border-color .25s, transform .25s;
}
.car::before, .car::after {
  content: ""; position: absolute; bottom: -14px; width: 22px; height: 22px; border-radius: 50%;
  background: #D9C3D6; border: 4px solid var(--paper);
}
.car::before { left: 10px; } .car::after { right: 10px; }
.car.on { background: var(--gold); color: var(--ink); border: 4px solid var(--gold-deep); transform: translateY(-4px); }
.car.on::before, .car.on::after { background: var(--berry); }
.car.need { border-color: var(--rose); color: var(--berry); background: #FFE8F2; animation: pulse 1s ease-in-out infinite; }
.car.blank { color: var(--rose); }
.car.dot { min-width: 34px; padding-inline: 8px; }
@keyframes pulse { 50% { transform: translateY(-6px) scale(1.04); } }

/* option cards */
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; width: 100%; max-width: 760px; }
.opt {
  background: #fff; border: 4px solid var(--line); border-radius: 24px; padding: 10px 8px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: var(--shadow);
}
.opt:active { transform: translateY(3px); }
.opt .en { font-size: 28px; font-weight: 600; }
.opt .zh { font-size: 20px; color: var(--ink-soft); }
.opt.right { border-color: var(--mint); background: #EAFBF3; }
.opt.wiggle { animation: wiggle .4s; }
@keyframes wiggle { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
.opt.hidden-word .en, .opt.hidden-word .zh { visibility: hidden; }

/* word card */
.wordcard { display: flex; gap: 24px; align-items: center; justify-content: center; flex-wrap: wrap; }
.wordcard .w { font-size: 64px; font-weight: 700; color: var(--berry); line-height: 1; }
.wordcard .wz { font-size: 34px; }
.act { display: inline-flex; gap: 8px; align-items: center; background: #F3ECFF; border-radius: 16px; padding: 6px 14px; font-size: 22px; }

/* speak panel */
.speak { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.mic {
  width: 112px; height: 112px; border-radius: 50%; font-size: 52px;
  background: var(--berry); color: #fff; box-shadow: 0 8px 0 #8E2A58;
  display: grid; place-items: center;
}
.mic.listening { animation: pulse 1s infinite; background: #E0569A; }
.msg { font-size: 22px; text-align: center; min-height: 1.7em; }
.field.dict {
  flex: 1 1 320px; max-width: 560px; min-height: 72px; font-size: 28px; font-family: var(--font-en);
  border: 4px solid var(--rose); border-radius: 22px; padding: 10px 18px; background: #FFF6FA;
}
.field.dict:focus { outline: none; border-color: var(--berry); box-shadow: 0 0 0 5px #F9D3E5; }

/* friend scene */
.friend { font-size: 110px; line-height: 1; position: relative; margin-right: 44px; }
.friend .ex { position: absolute; right: -36px; top: -14px; font-size: 54px; }

/* maps */
.kingdom { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; width: 100%; }
.land {
  border-radius: 28px; padding: 16px; min-height: 150px; text-align: left;
  display: flex; flex-direction: column; gap: 6px; border: 4px solid var(--line); background: #fff; box-shadow: var(--shadow);
}
.land .ic { font-size: 54px; line-height: 1; }
.land .nm { font-size: 24px; }
.land .sub { font-size: 16px; color: var(--ink-soft); font-family: var(--font-en); }
.land.open { background: linear-gradient(160deg, #FFE3F0, #F1E6FF); border-color: var(--rose); }
.land.locked { opacity: .55; filter: grayscale(.5); }
.path { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; width: 100%; }
.node {
  border-radius: 24px; border: 4px solid var(--line); background: #fff; padding: 12px; min-height: 120px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-shadow: var(--shadow);
}
.node .ic { font-size: 40px; line-height: 1; }
.node .nm { font-size: 20px; text-align: center; }
.node.done { background: #FFF4D6; border-color: var(--gold); }
.node.now { background: #FFE3F0; border-color: var(--berry); animation: pulse 1.6s ease-in-out infinite; }
.node.locked { opacity: .45; }
.node.boss { background: linear-gradient(160deg, #FFF0B8, #FFD6EA); }

/* book + wardrobe */
.book { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; width: 100%; }
.page { background: #fff; border: 4px solid var(--line); border-radius: 22px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
.page.off { filter: grayscale(1); opacity: .45; }
.page .en { font-weight: 600; font-size: 22px; }
.page .zh { font-size: 18px; color: var(--ink-soft); }
.dresses { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; width: 100%; max-width: 760px; }
.dress { border: 4px solid var(--line); border-radius: 22px; background: #fff; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.dress .sw { width: 56px; height: 56px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 0 3px var(--line); display: grid; place-items: center; font-size: 24px; }
.dress .sw.icon { background: #FFF4FA; font-size: 30px; }
.closet { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; justify-content: center; width: 100%; }
.mirror {
  flex: 0 1 300px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  background: radial-gradient(circle at 50% 35%, #FFFFFF, #FBE6F4 60%, #EADCFB);
  border: 6px solid var(--gold); border-radius: 160px 160px 28px 28px; padding: 18px 10px 14px;
  box-shadow: inset 0 0 0 4px #fff;
}
.mirror .princess { height: min(460px, 62vh); }
.closet-side { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab {
  display: inline-flex; align-items: center; gap: 4px; min-height: 52px; padding: 6px 12px;
  border-radius: 16px; border: 3px solid var(--line); background: #fff; font-size: 22px;
}
.tab .zh { font-size: 18px; }
.tab.on { background: var(--berry); border-color: var(--berry); color: #fff; }
.dress.sel { border-color: var(--berry); background: #FFE8F2; }
.dress.lock { opacity: .5; }
.dress.trying { opacity: 1; border-color: var(--lilac); background: #F3ECFF; }
.dress .sw.pv { width: 76px; height: 76px; border-radius: 20px; background: #FFF4FA; overflow: hidden; }
.dress .sw.pv svg { width: 100%; height: 100%; max-width: none; }
.dress .sw.face { width: 76px; height: 76px; border-radius: 20px; background: #FFF4FA; overflow: hidden; }
.dress .sw.face .princess.sm { width: 76px; }
.tryon { background: #F3ECFF; border: 3px dashed var(--lilac); border-radius: 18px; padding: 6px 14px; font-size: 18px; text-align: center; }
.photo .card { max-width: 520px; }
.photo-img { width: min(100%, 360px); height: auto; border-radius: 22px; box-shadow: 0 6px 0 #E7C6DC; -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }
.dress .zh { font-size: 18px; }

/* parent */
table { border-collapse: collapse; width: 100%; font-size: 18px; }
th, td { border-bottom: 2px solid var(--line); padding: 8px 6px; text-align: left; font-variant-numeric: tabular-nums; }
.tablebox { width: 100%; overflow-x: auto; }

/* celebrate */
.burst { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.burst span { position: absolute; top: -10vh; font-size: 40px; animation: fall 2.2s ease-in forwards; }
@keyframes fall { to { transform: translateY(120vh) rotate(360deg); } }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px; font-size: 22px; z-index: 30;
}
.shoe-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; font-size: 34px; }
.progress { display: flex; gap: 6px; }
.progress i { width: 16px; height: 16px; border-radius: 50%; background: var(--line); display: block; }
.progress i.on { background: var(--berry); }
.progress i.now { background: var(--rose); transform: scale(1.4); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--berry); animation: dotpulse 1.4s ease-in-out infinite; }
@keyframes dotpulse { 50% { transform: scale(1.7); } }

/* eye rest */
.rest {
  position: fixed; inset: 0; z-index: 40; overflow-y: auto;
  background: linear-gradient(180deg, #E3F1FF, #EDE4FF);
  display: flex; align-items: center; justify-content: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.rest .card { max-width: 640px; width: 100%; }
.tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; width: 100%; }
.tip { background: #fff; border: 3px solid var(--line); border-radius: 20px; padding: 10px; text-align: center; font-size: 20px; }
.tip b { display: block; font-size: 40px; line-height: 1.2; }
.btn:disabled { opacity: .45; }

/* parent tools */
.section { display: flex; flex-direction: column; gap: 10px; border-top: 3px dashed var(--line); padding-top: 14px; }
.section h3 { margin: 0; font-size: 22px; font-weight: 400; }
.codebox {
  font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 18px; letter-spacing: .04em;
  background: #F6EEF6; border: 3px solid var(--line); border-radius: 14px; padding: 10px 12px;
  word-break: break-all; -webkit-user-select: all; user-select: all;
}
.field {
  font: inherit; font-size: 18px; padding: 10px 12px; border-radius: 14px; border: 3px solid var(--line);
  background: #fff; color: var(--ink); min-height: 52px; box-sizing: border-box; width: 100%; max-width: 100%;
  -webkit-user-select: text; user-select: text;
}
select.field { width: auto; }
.note { font-size: 17px; color: var(--ink-soft); margin: 0; }

/* pictures for words */
.emo { line-height: 1.1; display: inline-block; }
.blob { border-radius: 50%; display: inline-grid; place-items: center; border: 5px solid #fff; box-shadow: 0 0 0 4px var(--line); flex: none; }
.combo { display: inline-flex; align-items: flex-end; gap: 4px; line-height: 1.1; }
.combo.room > span:last-child { margin-left: -28px; }
.count { display: inline-flex; flex-wrap: wrap; justify-content: center; line-height: 1.15; }
.num { font-family: var(--font-en); font-weight: 700; color: var(--berry); line-height: 1; min-width: 1.2em; text-align: center; }
.scn { position: relative; display: inline-block; flex: none; }
.scn > span { position: absolute; left: 50%; transform: translateX(-50%); line-height: 1; }
.booksec { margin: 6px 0 0; font-size: 24px; font-weight: 400; align-self: flex-start; }
/* page guidance: listen -> choose -> say, a breathing main button and a pointing hand */
.steps { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
.steps span { padding: 4px 14px; border-radius: 999px; background: #F3ECFF; color: var(--ink-soft); opacity: .55; font-size: 20px; }
.steps span b { font-weight: 400; }
.steps span.on { background: var(--berry); color: #fff; opacity: 1; }
.steps i { font-style: normal; color: var(--line); }
.btn.big:not(:disabled) { animation: breathe 2.2s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.05); } }
#hand { position: absolute; z-index: 35; font-size: 58px; pointer-events: none; transform: translate(-50%, 0); animation: tap 1s ease-in-out infinite; }
@keyframes tap { 50% { transform: translate(-50%, -16px); } }
.node, .land { position: relative; }
.me { position: absolute; top: -30px; right: -8px; pointer-events: none; }
.me .princess.sm { width: 56px; }
.land.now { border-color: var(--berry); animation: pulse 1.8s ease-in-out infinite; }
.parentlink { position: absolute; right: 14px; bottom: 10px; font-size: 16px; color: var(--ink-soft); opacity: .7; padding: 6px 10px; }

/* fit the tablet screen: sizes follow the screen height so a stage fits without scrolling */
body { margin: 0; }
.wrap { padding-block: 10px 14px; gap: 10px; }
.opts.small { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; max-width: 980px; }
.opts.small .opt { padding: 4px 4px 6px; border-width: 3px; border-radius: 18px; }
.opts.small .opt .princess.sm { width: clamp(52px, 8vh, 72px); }
.opts.small .opt .en { font-size: 20px; }
.opts.small .opt .zh { font-size: 15px; }
#stage { gap: clamp(8px, 1.6vh, 18px); padding-block: clamp(12px, 2vh, 22px); }
#stage #body { gap: clamp(8px, 1.6vh, 18px) !important; }
#stage .scene .princess:not(.sm) { height: clamp(150px, 30vh, 300px); }
.wordcard .princess.lg { height: clamp(220px, 44vh, 420px); }
#stage .bubble { font-size: clamp(24px, 3.6vh, 34px); padding: clamp(8px, 1.3vh, 14px) 20px; }
#stage .car { font-size: clamp(24px, 3.8vh, 34px); padding-block: clamp(8px, 1.4vh, 14px) clamp(12px, 2vh, 18px); }
#stage .horse { font-size: clamp(36px, 6vh, 56px); }
#stage .mic { width: clamp(76px, 11vh, 112px); height: clamp(76px, 11vh, 112px); font-size: clamp(36px, 5vh, 52px); }
#stage .say-zh { font-size: clamp(19px, 2.8vh, 24px); }
#stage .opt { padding: 6px 6px 8px; }
#stage .opt .princess.sm { width: clamp(96px, 17vh, 140px); }
.mirror .princess { height: clamp(260px, 56vh, 460px); }
.closet .dresses { max-height: calc(100vh - 250px); overflow-y: auto; padding: 4px; }

@media (max-width: 560px) {
  body { font-size: 18px; }
  .bubble { font-size: 26px; }
  .car { font-size: 26px; min-width: 64px; padding: 10px 12px 16px; }
  .horse { font-size: 42px; }
  .wordcard .w { font-size: 48px; }
  .title-zh { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap" id="app"></div>
<div class="burst" id="burst" aria-hidden="true"></div>

<script>
/* ---------- data ---------- */
const FEELINGS = {
  happy:   { zh: '開心',   eyes: 'happy',  mouth: 'bigsmile', ex: '✨', act: '拍拍手' },
  sad:     { zh: '難過',   eyes: 'open',   mouth: 'frown', brows: 'sad', tear: true, act: '假裝擦眼淚' },
  sleepy:  { zh: '想睡',   eyes: 'closed', mouth: 'yawn', zzz: true, act: '打一個哈欠' },
  hungry:  { zh: '肚子餓', eyes: 'open',   mouth: 'open', ex: '🍗', act: '摸摸肚子' },
  angry:   { zh: '生氣',   eyes: 'open',   mouth: 'frown', brows: 'angry', cheek: '#FF6B6B', ex: '💢', act: '雙手放在腰上' },
  tired:   { zh: '很累',   eyes: 'half',   mouth: 'flat', ex: '💦', act: '垂下肩膀' },
  good:    { zh: '很好',   eyes: 'open',   mouth: 'smile', ex: '👍', act: '比一個讚' },
  shy:     { zh: '害羞',   eyes: 'down',   mouth: 'smallsmile', cheek: '#FF7FA6', blush: true, act: '雙手遮住臉' },
  worried: { zh: '擔心',   eyes: 'open',   mouth: 'wavy', brows: 'sad', ex: '💦', act: '咬咬手指' },

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
let RUN = 0;
const ABORT = {};
function guard(id) { if (id !== RUN) throw ABORT; }
const wait = ms => new Promise(r => setTimeout(r, ms));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function learned() { const out = []; ROUNDS.forEach((r, i) => { if (S.all || S.unlocked > i * 4) out.push(...r); }); return out; }
function clickOnce(el) { return new Promise(r => el.addEventListener('click', r, { once: true })); }
function toast(t) { const d = document.createElement('div'); d.className = 'toast zh'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
function celebrate(icons = ['💎', '✨', '👑', '💖', '⭐']) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const b = $('#burst');
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('span');
    s.textContent = icons[i % icons.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDelay = Math.random() * .6 + 's';
    b.appendChild(s); setTimeout(() => s.remove(), 3000);
  }
}
function topbar(back) {
  return `<div class="bar">
    ${back ? `<button class="iconbtn" data-go="${back}" aria-label="back">⬅️ <span class="zh">${back === 'home' ? '城堡' : '地圖'}</span></button>` : ''}
    <span class="spacer"></span>
    <span class="chip" title="gems">💎 <span id="gems">${S.gems}</span></span>
    <span class="chip" title="glass shoes">👠 ${S.shoes}</span>
  </div>`;
}
function wireNav() {
  app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
}
function go(where) {
  RUN++; lastAct = Date.now(); hideHand(); tryOn = null;
  try { speechSynthesis.cancel(); } catch (e) {}
  if (where.startsWith('ch:')) chapterPage(+where.slice(3));
  else ({ home, kingdom, chapter1, book, wardrobe, parent })[where]();
  window.scrollTo(0, 0);
}
function spk(text, lang) { return `<button class="spk" data-say="${text.replace(/"/g, '&quot;')}" data-lang="${lang || 'en-US'}" aria-label="listen">🔊</button>`; }
function wireSpk(root = app) {
  root.querySelectorAll('[data-say]').forEach(b => { if (b._w) return; b._w = 1; b.addEventListener('click', e => { e.stopPropagation(); speak(b.dataset.say, b.dataset.lang); }); });
}

/* ---------- carriage ---------- */
function trainHTML(tokens, state) {
  return `<div class="train" id="train"><span class="horse" aria-hidden="true">🐴</span>${tokens.map((t, i) =>
    `<span class="car ${state[i] || ''} ${t === '.' ? 'dot' : ''}" data-i="${i}">${t}</span>`).join('')}</div>`;
}
function setCars(states) {
  document.querySelectorAll('#train .car').forEach((c, i) => { c.className = 'car ' + (states[i] || '') + (c.textContent === '.' ? ' dot' : ''); });
}
async function lightUp(n, ms = 420) {
  const cars = document.querySelectorAll('#train .car');
  for (let i = 0; i < Math.min(n, cars.length); i++) { cars[i].classList.remove('need', 'blank'); cars[i].classList.add('on'); await wait(ms); }
}
async function drive() { const t = $('#train'); if (!t) return; t.classList.remove('go'); void t.offsetWidth; t.classList.add('go'); await wait(1200); }

/* ---------- the speaking panel: no timer, finish the whole sentence ---------- */
function speakPanel(target, opts = {}) {
  phase('say');
  // target: array of English words that must all be said, e.g. ['I','am','sleepy']
  return new Promise(resolve => {
    const box = $('#speak');
    let tries = 0;
    const sentence = target.join(' ') + '.';
    const render = (msg = '') => {
      box.innerHTML = srOK
        ? `<div class="row">
             <button class="mic" id="mic" aria-label="speak">🎤</button>
             ${opts.hideModel ? '' : spk(sentence)}
           </div>
           <div class="msg zh" id="msg">${msg || '按麥克風，說出整句話'}</div>
           ${tries >= 2 ? `<button class="btn soft" id="pass"><span class="zh">我說好了</span> ✓</button>` : ''}`
        : S.check === 'dictation'
        ? `<div class="msg zh" id="msg">${msg || '點粉紅框，再按鍵盤上的 🎤，說出整句話'}</div>
           <div class="row" style="width:100%">
             <input class="field dict" id="dict" type="text" lang="en" inputmode="text" enterkeyhint="done"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="🎤 點這裡說英文" aria-label="say it in English">
             ${opts.hideModel ? '' : spk(sentence)}
           </div>
           ${tries >= 1 ? `<button class="btn soft" id="pass"><span class="zh">我說好了</span> ✓</button>` : ''}`
        : `<div class="msg zh" id="msg">${msg || '大聲說出整句話，說完按 ✓'}</div>
           <div class="row">
             ${opts.hideModel ? '' : spk(sentence)}
             <button class="btn mint big" id="pass"><span class="zh">我說好了</span> ✓</button>
           </div>`;
      wireSpk(box);
      const pass = $('#pass');
      if (pass) pass.addEventListener('click', () => resolve(true), { once: true });
      const dict = $('#dict');
      if (dict) {
        // iPad keyboard dictation types what the child says; check it the same way as the microphone
        const check = final => {
          const text = dict.value;
          if (!text.trim()) return;
          if (/[㐀-鿿]/.test(text)) { $('#msg').textContent = '鍵盤是中文的，請按 🌐 換成英文鍵盤再說一次'; return; }
          let hit = heardWords(text, target);
          if (opts.alts && !hit[hit.length - 1] && opts.alts.some(a => heardWords(text, [a])[0])) hit[hit.length - 1] = true;
          const offset = opts.offset || 0, states = [];
          for (let i = 0; i < offset; i++) states[i] = 'on';
          hit.forEach((h, i) => states[i + offset] = h ? 'on' : 'need');
          setCars(states);
          if (hit.every(Boolean)) { dict.blur(); resolve(true); return; }
          if (final) { tries++; render(hit.some(Boolean) ? '還差一點點！閃閃的車廂還沒說到，再按 🎤 說一次整句' : '再按 🎤 試一次，說大聲一點點'); }
        };
        dict.addEventListener('input', () => check(false));
        dict.addEventListener('change', () => check(true));
        dict.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(true); } });
      }
      const mic = $('#mic');
      if (mic) mic.addEventListener('click', async () => {
        if (mic.classList.contains('listening')) return;
        mic.classList.add('listening'); $('#msg').textContent = '我在聽…請說整句話';
        const offset = opts.offset || 0;
        const check = said => {
          const hit = heardWords(said, target);
          // in the final quiz a face can fit more than one word (happy / great), so accept a close feeling too
          if (opts.alts && !hit[hit.length - 1] && opts.alts.some(a => heardWords(said, [a])[0])) hit[hit.length - 1] = true;
          const states = [];
          for (let i = 0; i < offset; i++) states[i] = 'on';
          hit.forEach((h, i) => states[i + offset] = h ? 'on' : '');
          return { hit, states };
        };
        const heard = await listen(target, said => { $('#msg').textContent = '🎧 ' + said; setCars(check(said).states); });
        if (heard === null) { render(srOK ? '' : '麥克風沒有打開。請到 iPad「設定 → Safari → 麥克風」選「允許」，或請家長幫忙按「我說好了」'); return; }
        tries++;
        if (!heard.text) {
          // the small code after the message tells the parent (and us) why nothing came back
          render(({ network: '網路不太穩，再按 🎤 試一次', 'no-speech': '沒有聽到聲音。按 🎤 之後，等按鈕在跳再開始說' }[heard.err] || '沒有聽到聲音。靠近一點，按 🎤 再說一次') +
            `<br><small style="opacity:.6">（${esc(heard.err || 'no-result')}·${heard.n || 0}）</small>`);
          return;
        }
        const { hit, states } = check(heard.text);
        setCars(states.map(s => s || 'need'));
        if (hit.every(Boolean)) { resolve(true); return; }
        render(`${hit.some(Boolean) ? '還差一點點！閃閃的車廂還沒說到，再說一次整句' : '聽起來不太一樣，再說一次整句'}<br><small>我聽到：「${esc(heard.text)}」</small>`);
      });
    };
    render();
  });
}

/* ---------- stages ---------- */
function stageShell(i, step, total) {
  const s = STAGES[i];
  return `${topbar('chapter1')}
    <div class="card" id="stage">
      <div class="row" style="width:100%;justify-content:space-between">
        <span class="zh" style="font-size:22px">${s.ic} ${s.name}</span>
        <span class="progress">${Array.from({ length: total }, (_, k) => `<i class="${k < step ? 'on' : k === step ? 'now' : ''}"></i>`).join('')}</span>
      </div>
      ${stepsHTML(s.type)}
      <div id="body" style="display:flex;flex-direction:column;align-items:center;gap:18px;width:100%"></div>
    </div>`;
}
// listen -> choose -> say: the strip shows which step the child is on
// stages without picture cards (sentence carriage, the final quiz) show only listen -> say
function stepsHTML(type) {
  const choose = !['carriage', 'boss'].includes(type);
  return `<div class="steps" id="steps"><span data-s="listen">👂 <b class="zh">聽</b></span><i>➜</i>${choose ? '<span data-s="choose">👆 <b class="zh">選</b></span><i>➜</i>' : ''}<span data-s="say">🗣️ <b class="zh">說</b></span></div>`;
}
function phase(p) { document.querySelectorAll('#steps [data-s]').forEach(e => e.classList.toggle('on', e.dataset.s === p)); }
function body(html) { $('#body').innerHTML = html; wireSpk(); }
function setStep(i, step, total) { app.innerHTML = stageShell(i, step, total); wireNav(); phase('listen'); }

async function startStage(i) {
  const run = ++RUN;
  const s = STAGES[i];
  try {
    if (s.type === 'learn') await learnStage(i, run);
    if (s.type === 'carriage') await carriageStage(i, run);
    if (s.type === 'qa') await qaStage(i, run);
    if (s.type === 'friends') await friendsStage(i, run);
    if (s.type === 'boss') await bossStage(i, run);
    await finishStage(i, run);
  } catch (e) { if (e !== ABORT) throw e; }
}

async function learnStage(i, run) {
  const words = ROUNDS[STAGES[i].round];
  const total = words.length + 3;
  for (let k = 0; k < words.length; k++) {
    const w = words[k], f = FEELINGS[w];
    setStep(i, k, total);
    body(`<div class="wordcard">${princess(w, 'lg')}
        <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start">
          <div class="row"><span class="w">${w}</span>${spk(w)}</div>
          <div class="wz zh">${f.zh}</div>
          <div class="act zh">💃 做動作：${f.act}</div>
        </div></div>
      <div class="speak" id="speak"></div>`);
    await speak(w); guard(run);
    await wait(300); await speak(w); guard(run);
    await speakPanel([w], { hideModel: true }); guard(run); // the card already has its own speaker
    celebrate(['✨', '💖']);
    addGems(1);
  }
  // listen and choose, like the textbook's "Listen and Choose"
  const quiz = shuffle(words).slice(0, 3);
  for (let q = 0; q < quiz.length; q++) {
    const w = quiz[q];
    setStep(i, words.length + q, total);
    const opts = shuffle([w, ...shuffle(words.filter(x => x !== w)).slice(0, 2)]);
    body(`<div class="say-zh zh">聽一聽，是哪一個心情？ ${spk(w)}</div>
      <div class="opts" id="opts">${opts.map(o => optHTML(o, true)).join('')}</div>`);
    await speak(w); guard(run);
    await pickRight(w, run, true);
  }
}

function pickRight(w, run, sayWrong) {
  phase('choose');
  return new Promise(res => {
    app.querySelectorAll('#opts .opt').forEach(o => o.addEventListener('click', async () => {
      if (run !== RUN) return;
      if (o.dataset.w === w) {
        o.classList.add('right'); o.classList.remove('hidden-word');
        addGems(1); celebrate(['✨', '💖']);
        await speak(w); await wait(500); res(w);
      } else {
        o.classList.remove('wiggle'); void o.offsetWidth; o.classList.add('wiggle');
        if (sayWrong) { await speak('This is ' + o.dataset.w + '. Listen again.'); await speak(w); }
        else await speak('This is ' + o.dataset.w + '.');
      }
    }));
  });
}

async function carriageStage(i, run) {
  const words = ROUNDS[STAGES[i].round];
  for (let k = 0; k < words.length; k++) {
    const w = words[k];
    setStep(i, k, words.length);
    body(`<div class="scene">${princess(w)}<div class="bubble">How are you? ${spk('How are you?')}</div></div>
      ${trainHTML(['I', 'am', w, '.'], [])}
      <div class="say-zh zh" id="tip">先聽公主說一次</div>
      <div class="speak" id="speak"></div>`);
    await speak('How are you?'); guard(run);
    await wait(250);
    speak('I am ' + w + '.', 'en-US', 0.7);
    await lightUp(4, 480); guard(run);
    await wait(600); setCars([]);
    $('#tip').innerHTML = `換你說！每節車廂都要說到 ${spk('換你說！每節車廂都要說到，馬車才會出發喔。', 'zh-TW')}`;
    wireSpk();
    await speakPanel(['I', 'am', w]); guard(run);
    await lightUp(4, 120); await drive(); guard(run);
    wordStat(w).said++; addGems(2); celebrate();
    $('#tip').innerHTML = `好棒！馬車出發了 🎉`;
    $('#speak').innerHTML = `<div class="row">
      <button class="btn soft" id="again">🔁 <span class="zh">再說一次</span> +✨</button>
      <button class="btn big" id="next"><span class="zh">下一題</span> ➜</button></div>`;
    let more = true;
    while (more) {
      const c = await Promise.race([clickOnce($('#again')).then(() => 'a'), clickOnce($('#next')).then(() => 'n')]);
      guard(run);
      if (c === 'n') more = false;
      else {
        setCars([]);
        const keep = $('#speak').innerHTML;
        await speakPanel(['I', 'am', w]); guard(run);
        await lightUp(4, 100); await drive(); addGems(1); celebrate(['✨']);
        $('#speak').innerHTML = keep;
      }
    }
  }
}

async function choiceThenSay(run, { tokens, blankAt, answer, pool, hideModel = false }) {
  // fill the blank by tapping a picture card, then say the whole sentence
  const shown = tokens.map((t, i) => i === blankAt ? '?' : t);
  const opts = shuffle([answer, ...shuffle(pool.filter(x => x !== answer)).slice(0, 2)]);
  $('#area').innerHTML = `${trainHTML(shown, shown.map((t, i) => i === blankAt ? 'blank' : 'on'))}
    <div class="say-zh zh" id="tip">選一張圖，放進問號車廂 ${spk('選一張圖，放進問號車廂', 'zh-TW')}</div>
    <div class="opts" id="opts">${opts.map(o => optHTML(o)).join('')}</div>
    <div class="speak" id="speak"></div>`;
  wireSpk();
  await pickRight(answer, run, false); guard(run);
  $('#opts').remove();
  const cars = document.querySelectorAll('#train .car');
  cars[blankAt].textContent = answer; cars[blankAt].className = 'car on';
  await speak(tokens.slice(0, -1).join(' ') + '.'); guard(run);
  setCars([]);
  $('#tip').innerHTML = `現在說出整句話 ${spk('現在說出整句話', 'zh-TW')}`; wireSpk();
  await speakPanel(tokens.slice(0, -1), { hideModel }); guard(run);
  await lightUp(tokens.length, 110); await drive(); guard(run);
  wordStat(answer).said++; addGems(2); celebrate();
}

async function qaStage(i, run) {
  const r = STAGES[i].round;
  const words = shuffle(ROUNDS[r]);
  const pool = learned().length ? learned() : ROUNDS[r];
  for (let k = 0; k < words.length; k++) {
    const w = words[k];
    setStep(i, k, words.length);
    body(`<div class="scene">${princess(w)}<div class="bubble">How are you? ${spk('How are you?')}<small class="zh">你是公主，照鏡子回答</small></div></div>
      <div id="area" style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%"></div>`);
    await speak('How are you?'); guard(run);
    await choiceThenSay(run, { tokens: ['I', 'am', w, '.'], blankAt: 2, answer: w, pool: ROUNDS[r].concat(pool) });
    await nextBtn(run);
  }
}

async function friendsStage(i, run) {
  const r = STAGES[i].round;
  const list = shuffle(FRIENDS[r]);
  for (let k = 0; k < list.length; k++) {
    const fr = list[k];
    setStep(i, k, list.length);
    const q = `How is the ${fr.who}?`;
    body(`<div class="scene">
        <div class="friend" aria-hidden="true">${fr.em}<span class="ex">${fr.ex}</span></div>
        <div style="display:flex;flex-direction:column;gap:10px;align-items:center">
          <div class="say-zh zh">${fr.zh} ${spk(fr.zh, 'zh-TW')}</div>
          <div class="bubble">${q} ${spk(q)}</div>
        </div>
      </div>
      <div id="area" style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%"></div>`);
    await zhSay(fr.zh); guard(run);
    await speak(q); guard(run);
    await choiceThenSay(run, { tokens: ['The', fr.who, 'is', fr.f, '.'], blankAt: 3, answer: fr.f, pool: ROUNDS[r] });
    await nextBtn(run);
  }
}

async function bossStage(i, run) {
  const pool = learned();
  const qs = shuffle(pool).slice(0, 8);
  for (let k = 0; k < qs.length; k++) {
    const w = qs[k];
    setStep(i, k, qs.length);
    body(`<div class="scene">${princess(w)}<div class="bubble">How are you? ${spk('How are you?')}</div></div>
      <div id="area" style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%">
        ${trainHTML(['I', '?', '?', '.'], ['on', 'blank', 'blank', ''])}
        <div class="say-zh zh" id="tip">看公主的臉，自己說出整句話 ${spk('看公主的臉，自己說出整句話。想不起來可以按魔法提示。', 'zh-TW')}</div>
        <div class="row"><button class="btn soft" id="hint">🔮 <span class="zh">魔法提示</span></button></div>
        <div class="speak" id="speak"></div>
      </div>`);
    await speak('How are you?'); guard(run);
    $('#hint').addEventListener('click', async () => {
      wordStat(w).hint++; save();
      const cars = document.querySelectorAll('#train .car');
      cars[1].textContent = 'am'; cars[2].textContent = w;
      $('#hint').disabled = true; $('#hint').style.opacity = .5;
      await speak('I am ' + w + '.', 'en-US', 0.7);
    }, { once: true });
    const alts = (SIMILAR.find(g => g.includes(w)) || []).filter(x => x !== w);
    await speakPanel(['I', 'am', w], { hideModel: true, alts }); guard(run);
    const cars = document.querySelectorAll('#train .car');
    cars[1].textContent = 'am'; cars[2].textContent = w;
    await lightUp(4, 120); await drive(); guard(run);
    await speak('I am ' + w + '.'); guard(run);
    wordStat(w).said++; addGems(3); celebrate();
    await nextBtn(run);
  }
}

async function nextBtn(run) {
  if ($('#tip')) $('#tip').textContent = '馬車出發了 🎉';
  $('#speak').innerHTML = `<div class="msg zh">好棒！說出完整的句子 💎</div><button class="btn big" id="next"><span class="zh">下一題</span> ➜</button>`;
  await clickOnce($('#next')); guard(run);
}

async function finishStage(i, run) {
  const first = !S.done[i];
  S.done[i] = true;
  if (first) S.shoes++;
  S.unlocked = Math.max(S.unlocked, i + 1);
  addGems(5); save();
  celebrate(['👠', '👑', '💎', '✨']);
  app.innerHTML = `${topbar('chapter1')}
    <div class="card">
      <div class="scene">${princess('excited', 'lg')}

  { id: 8, ic: '👑', zh: '皇家舞會', en: 'All the questions together', boss: '皇家舞會大考驗', mix: true,
    intro: '皇家舞會開始了！前面學過的問題都會出現，用完整的句子回答。', rounds: [] },
];
// chapter 1 feelings, written the same way so the royal ball can ask them too
const FEEL_ITEMS = ROUNDS.flat().map(w => ({ id: w, key: w, w, zh: FEELINGS[w].zh, pic: { type: 'face', f: w }, q: 'How are you?', qzh: '你好嗎？', a: `I am [${w}]` }));
ROUNDS.forEach(r => { const items = FEEL_ITEMS.filter(it => r.includes(it.id)); items.forEach(it => it.round = items); });
CH.forEach(ch => {
  ch.items = [];
  ch.rounds.forEach(r => r.items.forEach(it => { it.key = `${ch.id}:${it.id}`; it.round = r.items; it.ch = ch.id; ch.items.push(it); }));
  ch.stages = [];
  if (ch.mix) {
    ['一', '二', '三'].forEach(n => ch.stages.push({ type: 'mix', ic: '💃', name: `舞會問答（${n}）` }));

      ch.stages.push({ type: 'carriage', round: i, ic: '🎠', name: `句子馬車（${n}）` });
      ch.stages.push({ type: 'qa', round: i, ic: '💬', name: `問答練習（${n}）` });
      ch.stages.push({ type: 'practice', round: i, ic: '🔁', name: `換個問法（${n}）` });
    });
  }
  ch.stages.push({ type: 'boss', ic: '👑', name: ch.boss });
});
const CH1 = { id: 1, ic: '🪞', zh: '心情魔法鏡', en: 'How are you? · How do you feel?' };
const ALL_CH = [CH1, ...CH];
const chById = id => CH.find(c => c.id === id);
const MIX_POOL = () => FEEL_ITEMS.concat(...CH.filter(c => !c.mix).map(c => c.items));
const ALL_KEYS = () => ROUNDS.flat().concat(...CH.map(c => c.items.map(it => it.key)));

/* answers: "This is a [bed]" -> tokens + the bracketed blank */
function sent(str) {
  const toks = []; let blank = null;
  str.replace(/\[([^\]]+)\]|(\S+)/g, (m, br, wd) => {
    if (br) { const ws = br.split(' '); blank = [toks.length, ws.length]; toks.push(...ws); } else toks.push(wd);
  });
  return { toks, blank, label: blank ? toks.slice(blank[0], blank[0] + blank[1]).join(' ') : '' };
}
const sentence = toks => toks.join(' ') + '.';

/* ---------- pictures for words (emoji, colors, shapes, little scenes) ---------- */
function shapeSVG(s, c, px) {
  const d = {
    circle: '<circle cx="50" cy="50" r="40"/>', square: '<rect x="13" y="13" width="74" height="74" rx="6"/>',
    triangle: '<path d="M50 10 L90 86 L10 86 Z"/>', star: `<path d="${starPath(50, 54, 46, .45)}"/>`,
    heart: `<path d="${heartPath(50, 46, 5.4)}"/>`, rectangle: '<rect x="6" y="26" width="88" height="50" rx="6"/>',
  }[s];
  return `<svg width="${px}" height="${px}" viewBox="0 0 100 100" aria-hidden="true"><g fill="${c}" stroke="#fff" stroke-width="4" stroke-linejoin="round">${d}</g></svg>`;
}
function sceneHTML({ obj, place, prep }, px) {
  const small = Math.round(px * .55);
  const objCss = { on: `bottom:${Math.round(px * .78)}px;z-index:3`, in: `bottom:${Math.round(px * .6)}px;z-index:1`, under: 'bottom:0;z-index:1' }[prep];
  const placeCss = prep === 'under' ? `bottom:${Math.round(small * .75)}px` : 'bottom:0';
  return `<span class="scn" style="width:${Math.round(px * 1.3)}px;height:${Math.round(px * 1.5)}px" aria-hidden="true"><span style="font-size:${px}px;${placeCss};z-index:2">${place}</span><span style="font-size:${small}px;${objCss}">${obj}</span></span>`;
}
function pic(p, size = 'md') {
  const px = { lg: 150, md: 110, sm: 62 }[size];
  if (typeof p === 'string') return `<span class="emo" style="font-size:${px}px" aria-hidden="true">${p}</span>`;
  switch (p.type) {
    case 'face': return princess(p.f, 'sm').replace('class="princess sm"', `class="princess sm" style="width:${Math.round(px * 1.3)}px"`);
    case 'color': return `<span class="blob" style="background:${p.c};width:${px}px;height:${px}px"><span style="font-size:${Math.round(px * .55)}px">${p.em}</span></span>`;
    case 'shape': return shapeSVG(p.s, p.c, px);
    case 'combo': return `<span class="combo" aria-hidden="true"><span style="font-size:${px}px">${p.a}</span><span style="font-size:${Math.round(px * .62)}px">${p.b}</span></span>`;
    case 'count': return `<span class="count" style="font-size:${Math.round(px * (p.n > 4 ? .32 : .42))}px;width:${Math.round(px * 1.4)}px" aria-hidden="true">${Array(p.n).fill(p.em).join('')}</span>`;
    case 'num': return `<span class="num" style="font-size:${Math.round(px * .8)}px">${p.n}</span>`;
    case 'scene': return sceneHTML(p, px);
    case 'room': return `<span class="combo room" aria-hidden="true"><span style="font-size:${px}px">${p.place}</span><span style="font-size:${Math.round(px * .58)}px">${p.who}</span></span>`;
  }
  return '';
}

/* ---------- progress for chapters 2–8 ---------- */
function prog(id) { S.ch = S.ch || {}; return S.ch[id] || (S.ch[id] = { u: 0, d: {} }); }
function chDone(id) { if (id === 1) return !!S.done[STAGES.length - 1]; const ch = chById(id); return !!prog(id).d[ch.stages.length - 1]; }
function chOpen() { return true; }
function currentCh() {
  // the first open chapter that is not finished yet; otherwise the last open one
  let last = 1;
  for (const c of ALL_CH) { if (!chOpen(c.id)) break; last = c.id; if (!chDone(c.id)) return c.id; }
  return last;
}
function goCh(id) { return id === 1 ? 'chapter1' : `ch:${id}`; }

function chapterPage(id) {
  const ch = chById(id), p = prog(id);
  const open = S.all ? ch.stages.length - 1 : Math.min(p.u, ch.stages.length - 1);
  app.innerHTML = `${topbar('kingdom')}
    <div class="card">
      <div class="scene">
        <span class="emo" style="font-size:80px" aria-hidden="true">${ch.ic}</span>
        <div>
          <h2 class="title-zh">${ch.zh}</h2>
          <div class="say-zh zh">${ch.intro} ${spk(ch.intro, 'zh-TW')}</div>
        </div>
      </div>
      <div class="path">
        ${ch.stages.map((s, i) => {
          const st = p.d[i] ? 'done' : i === open ? 'now' : i < open ? '' : 'locked';
          return `<button class="node ${st} ${s.type === 'boss' ? 'boss' : ''}" data-stage="${i}" ${i > open ? 'aria-disabled="true"' : ''}>
            ${i === open ? `<span class="me">${princess(faceNow(), 'sm')}</span>` : ''}
            <span class="ic">${p.d[i] ? '👠' : i > open ? '🔒' : s.ic}</span>
            <span class="nm zh">${s.name}</span>
          </button>`;
        }).join('')}
      </div>
    </div>`;
  wireNav(); wireSpk();
  app.querySelectorAll('[data-stage]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.stage;
    if (i > open) { toast('先過前面的關卡喔！'); return; }
    gStart(ch, i);
  }));
}

/* ---------- stages for chapters 2–8 ---------- */
function gShell(ch, idx, step, total) {
  const s = ch.stages[idx];
  return `${topbar(goCh(ch.id))}
    <div class="card" id="stage">
      <div class="row" style="width:100%;justify-content:space-between">
        <span class="zh" style="font-size:22px">${s.ic} ${s.name}</span>
        <span class="progress">${Array.from({ length: total }, (_, k) => `<i class="${k < step ? 'on' : k === step ? 'now' : ''}"></i>`).join('')}</span>
      </div>
      ${stepsHTML(s.type)}
      <div id="body" style="display:flex;flex-direction:column;align-items:center;gap:18px;width:100%"></div>
    </div>`;
}
function gSet(ch, idx, step, total) { app.innerHTML = gShell(ch, idx, step, total); wireNav(); phase('listen'); }
function gOpt(key, p, en, zh, hidden) {
  return `<button class="opt ${hidden ? 'hidden-word' : ''}" data-w="${key}">${pic(p, 'sm')}<span class="en">${en}</span><span class="zh">${zh}</span></button>`;
}
function gPick(answer, run) {
  phase('choose');
  return new Promise(res => {
    app.querySelectorAll('#opts .opt').forEach(o => o.addEventListener('click', async () => {
      if (run !== RUN) return;
      if (o.dataset.w === answer) {
        o.classList.add('right'); o.classList.remove('hidden-word');
        addGems(1); celebrate(['✨', '💖']);
        await wait(500); res();
      } else {
        o.classList.remove('wiggle'); void o.offsetWidth; o.classList.add('wiggle');
        await speak('Not this one. Try again.');
      }
    }));
  });
}
const gArea = () => '<div id="area" style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%"></div>';
function gScene(it, q, qzh) {
  return `<div class="scene">${pic(it.pic, 'md')}<div class="bubble">${q} ${spk(q)}${qzh ? `<small class="zh">${qzh}</small>` : ''}</div></div>`;
}

async function gStart(ch, idx) {
  const run = ++RUN;
  const s = ch.stages[idx];
  try {
    if (s.type === 'learn') await gLearn(ch, idx, run);
    if (s.type === 'carriage') await gCarriage(ch, idx, run);
    if (s.type === 'qa') await gQA(ch, idx, run, shuffle(ch.rounds[s.round].items), 'a');
    if (s.type === 'practice') await gQA(ch, idx, run, shuffle(ch.rounds[s.round].items), 'a2');
    if (s.type === 'mix') await gQA(ch, idx, run, shuffle(MIX_POOL()).slice(0, 6), 'a');
    if (s.type === 'boss') await gBoss(ch, idx, run, ch.mix ? shuffle(MIX_POOL()).slice(0, 10) : shuffle(ch.items).slice(0, 8));
    await gFinish(ch, idx, run);
  } catch (e) { if (e !== ABORT) throw e; }
}

async function gLearn(ch, idx, run) {
  const items = ch.rounds[ch.stages[idx].round].items;
  const total = items.length + 3;
  for (let k = 0; k < items.length; k++) {
    const it = items[k];
    gSet(ch, idx, k, total);
    body(`<div class="wordcard">${pic(it.pic, 'lg')}
        <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start">
          <div class="row"><span class="w">${it.w}</span>${spk(it.w)}</div>
          <div class="wz zh">${it.zh}</div>
        </div></div>
      <div class="speak" id="speak"></div>`);
    await speak(it.w); guard(run);
    await wait(300); await speak(it.w); guard(run);
    await speakPanel(it.w.split(' '), { hideModel: true }); guard(run); // the card already has its own speaker
    wordStat(it.key).said++;
    celebrate(['✨', '💖']); addGems(1);
  }
  // listen and choose
  const quiz = shuffle(items).slice(0, 3);
  for (let q = 0; q < quiz.length; q++) {
    const it = quiz[q];
    gSet(ch, idx, items.length + q, total);
    const opts = shuffle([it, ...shuffle(items.filter(x => x !== it)).slice(0, 2)]);
    body(`<div class="say-zh zh">聽一聽，是哪一個？ ${spk(it.w)}</div>
      <div class="opts" id="opts">${opts.map(o => gOpt(o.id, o.pic, o.w, o.zh, true)).join('')}</div>`);
    await speak(it.w); guard(run);
    await gPick(it.id, run); guard(run);
    await speak(it.w); guard(run);
  }
}

async function gCarriage(ch, idx, run) {
  const items = ch.rounds[ch.stages[idx].round].items;
  for (let k = 0; k < items.length; k++) {
    const it = items[k], s = sent(it.a);
    gSet(ch, idx, k, items.length);
    body(`${gScene(it, it.q, it.qzh)}
      ${trainHTML(s.toks.concat('.'), [])}
      <div class="say-zh zh" id="tip">先聽公主說一次</div>
      <div class="speak" id="speak"></div>`);
    await speak(it.q); guard(run);
    await wait(250);
    speak(sentence(s.toks), 'en-US', 0.7);
    await lightUp(s.toks.length + 1, 420); guard(run);
    await wait(600); setCars([]);
    $('#tip').innerHTML = `換你說！每節車廂都要說到 ${spk('換你說！每節車廂都要說到，馬車才會出發喔。', 'zh-TW')}`;
    wireSpk();
    await speakPanel(s.toks); guard(run);
    await lightUp(s.toks.length + 1, 110); await drive(); guard(run);
    wordStat(it.key).said++; addGems(2); celebrate();
    await nextBtn(run);
  }
}

async function gChoose(run, it, which) {
  // tap the picture that fills the "?" car, then say the whole sentence
  const s = sent(it[which] || it.a);
  const [b0, bl] = s.blank;
  const labelOf = x => sent(x[which] || x.a).label;
  const byLabel = {};
  it.round.forEach(x => { const l = labelOf(x); if (!byLabel[l]) byLabel[l] = x; });
  const others = shuffle(Object.keys(byLabel).filter(l => l !== s.label)).slice(0, 2);
  const opts = shuffle([s.label, ...others]);
  const shown = [...s.toks.slice(0, b0), '?', ...s.toks.slice(b0 + bl), '.'];
  $('#area').innerHTML = `<div id="tw">${trainHTML(shown, shown.map((t, i) => i === b0 ? 'blank' : 'on'))}</div>
    <div class="say-zh zh" id="tip">選一張圖，放進問號車廂 ${spk('選一張圖，放進問號車廂', 'zh-TW')}</div>
    <div class="opts" id="opts">${opts.map(l => { const x = l === s.label ? it : byLabel[l]; return gOpt(l, x.opt || x.pic, l, x.optZh || x.zh); }).join('')}</div>
    <div class="speak" id="speak"></div>`;
  wireSpk();
  await gPick(s.label, run); guard(run);
  $('#opts').remove();
  $('#tw').innerHTML = trainHTML(s.toks.concat('.'), s.toks.map(() => 'on').concat('on'));
  await speak(sentence(s.toks)); guard(run);
  setCars([]);
  $('#tip').innerHTML = `現在說出整句話 ${spk('現在說出整句話', 'zh-TW')}`; wireSpk();
  await speakPanel(s.toks); guard(run);
  await lightUp(s.toks.length + 1, 110); await drive(); guard(run);
  wordStat(it.key).said++; addGems(2); celebrate();
}

async function gQA(ch, idx, run, list, which) {
  for (let k = 0; k < list.length; k++) {
    const it = list[k];
    const w = it[which] ? which : 'a';
    const q = w === 'a2' ? it.q2 : it.q, qzh = w === 'a2' ? it.q2zh : it.qzh;
    gSet(ch, idx, k, list.length);
    body(`${gScene(it, q, qzh)}${gArea()}`);
    await speak(q); guard(run);
    await gChoose(run, it, w);
    await nextBtn(run);
  }
}

async function gBoss(ch, idx, run, list) {
  for (let k = 0; k < list.length; k++) {
    const it = list[k], s = sent(it.a);
    gSet(ch, idx, k, list.length);
    const shown = [s.toks[0], ...s.toks.slice(1).map(() => '?'), '.'];
    body(`${gScene(it, it.q, '')}
      <div id="area" style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%">
        ${trainHTML(shown, ['on', ...s.toks.slice(1).map(() => 'blank'), ''])}
        <div class="say-zh zh" id="tip">看圖，自己說出整句話 ${spk('看圖，自己說出整句話。想不起來可以按魔法提示。', 'zh-TW')}</div>
        <div class="row"><button class="btn soft" id="hint">🔮 <span class="zh">魔法提示</span></button></div>
        <div class="speak" id="speak"></div>
      </div>`);
    await speak(it.q); guard(run);
    const reveal = () => document.querySelectorAll('#train .car').forEach((c, i) => { if (i < s.toks.length) c.textContent = s.toks[i]; });
    $('#hint').addEventListener('click', async () => {
      wordStat(it.key).hint++; save();
      reveal();
      $('#hint').disabled = true;
      await speak(sentence(s.toks), 'en-US', 0.7);
    }, { once: true });
    await speakPanel(s.toks, { hideModel: true }); guard(run);
    reveal();
    await lightUp(s.toks.length + 1, 110); await drive(); guard(run);
    await speak(sentence(s.toks)); guard(run);
    wordStat(it.key).said++; addGems(3); celebrate();
    await nextBtn(run);
  }
}

async function gFinish(ch, idx, run) {
  const p = prog(ch.id);
  const first = !p.d[idx];
  p.d[idx] = true;
  if (first) S.shoes++;
  p.u = Math.max(p.u, idx + 1);
  addGems(5); save();
  celebrate(['👠', '👑', '💎', '✨']);
  app.innerHTML = `${topbar(goCh(ch.id))}
    <div class="card">

        </div>

}

/* ---------- fit each game screen inside the tablet; the picture book and parent page are lists and scroll ---------- */
let fitTimer = null;
function fitScreen() {
  app.style.zoom = '';
  if (app.querySelector('.book, .tablebox')) return;
  const bottom = Math.max(0, ...[...app.children].map(c => c.getBoundingClientRect().bottom + scrollY)) + 14;
  if (bottom > innerHeight) app.style.zoom = Math.max(.62, innerHeight / bottom).toFixed(3);
}
new MutationObserver(() => { clearTimeout(fitTimer); fitTimer = setTimeout(fitScreen, 30); }).observe(app, { childList: true, subtree: true });
addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitScreen, 60); });

/* ---------- page guidance: after 8 quiet seconds a hand points at the next thing to tap ---------- */
let lastAct = Date.now();
function hideHand() { const h = document.getElementById('hand'); if (h) h.remove(); }
['pointerdown', 'keydown', 'input'].forEach(ev => addEventListener(ev, () => { lastAct = Date.now(); hideHand(); }, true));
setInterval(() => {
  const old = document.getElementById('hand');
  if (old && !(old.target && old.target.isConnected && old.target.offsetParent)) old.remove();
  if (resting || document.hidden || Date.now() - lastAct < 8000 || document.getElementById('hand')) return;
  const order = ['#next', '.card .btn.big:not(:disabled)', '#dict', '#mic', '#pass', '.node.now', '.land.now', '#tip .spk', '.say-zh .spk'];
  let t = null;
  for (const s of order) { const e = document.querySelector(s); if (e && e.offsetParent) { t = e; break; } }
  if (!t) return;
  const r = t.getBoundingClientRect();
  const h = document.createElement('div');
  h.id = 'hand'; h.textContent = '👆'; h.setAttribute('aria-hidden', 'true'); h.target = t;
  h.style.left = (r.left + r.width / 2 + scrollX) + 'px';
  h.style.top = (r.bottom + scrollY - 12) + 'px';
  document.body.appendChild(h);
}, 1000);

/* ---------- wardrobe ---------- */
let wardrobeTab = 'dress';
let tryOn = null; // a locked item shown on the mirror before it is earned
const faceNow = () => S.face || S.mood || 'happy';
// a face is ready once she has said that feeling in a whole sentence; happy and good are ready from the start
const faceOpen = w => w === 'happy' || w === 'good' || (S.words[w] || {}).said > 0;
function swatch(key, it) {

  const views = { dress: '0 140 240 278', hair: '0 0 240 340', head: '56 0 128 100', earring: '66 96 108 64', necklace: '94 146 52 46' };
  if (views[key]) return pv(views[key]);
  if (key === 'dress') {
    const bg = it.main === 'RAINBOW' ? `linear-gradient(135deg,${RAINBOW_STOPS.join(',')})` : `linear-gradient(135deg,${it.main} 55%,${it.light})`;
    return `<span class="sw" style="background:${bg}">👗</span>`;
  }
  if (key === 'color') return `<span class="sw" style="background:linear-gradient(135deg,${it.shine},${it.base} 45%,${it.dark})"></span>`;
  if (key === 'face') return `<span class="sw face">${princess(it.id, 'sm')}</span>`;
  if (key === 'shoes') return `<span class="sw" style="background:#FFF4FA"><svg viewBox="86 378 68 40" width="50" aria-hidden="true">${shoeArt(107, -1, it, '#F27DB5')}${shoeArt(133, 1, it, '#F27DB5')}</svg></span>`;
  if (key === 'nails') return `<span class="sw" style="background:${it.rainbow ? `linear-gradient(135deg,${RAINBOW_STOPS.join(',')})` : it.c}">💅</span>`;
  return `<span class="sw icon">${it.ic}</span>`;
}
function wardrobe() {
  const isFace = wardrobeTab === 'face';
  const items = isFace ? ROUNDS.flat().map(w => ({ id: w, zh: FEELINGS[w].zh })) : LOOK[wardrobeTab];
  const worn = id => isFace ? faceNow() === id : S.look[wardrobeTab] === id;
  const ready = it => isFace ? faceOpen(it.id) : S.gems >= it.need;
  const look = tryOn && tryOn.key !== 'face' ? Object.assign({}, S.look, { [tryOn.key]: tryOn.id }) : S.look;
  const face = tryOn && tryOn.key === 'face' ? tryOn.id : faceNow();
  app.innerHTML = `${topbar('home')}
    <div class="card">
      <h2 class="title-zh">換裝間</h2>
      <div class="closet">
        <div class="mirror">${princess(face, 'lg', look)}
          ${tryOn ? `<div class="tryon zh">👀 試穿中：${tryOn.zh}<br>${tryOn.key === 'face' ? '說過這個心情就能用' : `集到 💎${tryOn.need} 就能穿`}</div>
            <button class="btn soft" id="untry"><span class="zh">換回來</span></button>`
            : `<div class="say-zh zh" style="font-size:20px">💎 ${S.gems}　寶石越多，可以換的越多</div>
            <button class="btn gold" id="snap">📸 <span class="zh">公主照片</span></button>`}
        </div>
        <div class="closet-side">
          <div class="tabs" role="tablist">${LOOK_TABS.concat([['face', '😊', '表情']]).map(([k, ic, zh]) =>
            `<button class="tab ${k === wardrobeTab ? 'on' : ''}" role="tab" aria-selected="${k === wardrobeTab}" data-tab="${k}">${ic}<span class="zh">${zh}</span></button>`).join('')}</div>
          <div class="say-zh zh" style="font-size:18px">${isFace ? '🔒 的表情，在關卡裡說過就能用' : '🔒 的可以先按按看，試穿一下'}</div>
          <div class="dresses">${items.map(it => {
            const ok = ready(it), on = worn(it.id), trying = tryOn && tryOn.key === wardrobeTab && tryOn.id === it.id;
            return `<button class="dress ${on ? 'sel' : ''} ${ok ? '' : 'lock'} ${trying ? 'trying' : ''}" data-id="${it.id}">
              ${swatch(wardrobeTab, it)}
              <span class="zh">${it.zh}</span>
              <span style="font-size:16px">${on ? '穿上了 ✓' : trying ? '試穿中 👀' : ok ? '' : isFace ? '🔒' : '🔒 💎' + it.need}</span></button>`;
          }).join('')}</div>
        </div>
      </div>
    </div>`;
  wireNav();
  app.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { wardrobeTab = b.dataset.tab; tryOn = null; wardrobe(); }));
  if ($('#untry')) $('#untry').addEventListener('click', () => { tryOn = null; wardrobe(); });
  if ($('#snap')) $('#snap').addEventListener('click', showPhoto);
  app.querySelectorAll('.dress').forEach(b => b.addEventListener('click', () => {
    const it = items.find(x => x.id === b.dataset.id);
    if (!ready(it)) {
      // locked: show it on the mirror so she can see how it looks
      tryOn = { key: wardrobeTab, id: it.id, zh: it.zh, need: it.need };
      wardrobe();
      if (!isFace) zhSay(`試穿${it.zh}。集到${it.need}顆寶石，就能穿上喔！`);
      return;
    }
    tryOn = null;
    if (isFace) S.face = it.id; else S.look[wardrobeTab] = it.id;
    save(); wardrobe(); celebrate(['💖', '✨', '💎']);
  }));
}

/* ---------- princess photo: a picture of her to keep, share or copy ---------- */
async function princessPhoto() {
  const svg = princess(faceNow(), 'lg').replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="480" height="836" ');
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  const c = document.createElement('canvas');
  c.width = 600; c.height = 1000;
  const x = c.getContext('2d');
  const bg = x.createLinearGradient(0, 0, 0, 1000);
  bg.addColorStop(0, '#FCE4F1'); bg.addColorStop(1, '#E6DBFA');
  x.fillStyle = bg; x.fillRect(0, 0, 600, 1000);
  x.fillStyle = '#FFFBFD'; x.strokeStyle = '#F4C24D'; x.lineWidth = 10;
  x.beginPath();
  if (x.roundRect) x.roundRect(30, 30, 540, 940, [260, 260, 36, 36]); else x.rect(30, 30, 540, 940);
  x.fill(); x.stroke();
  x.drawImage(img, 60, 60, 480, 836);
  x.fillStyle = '#C2407A'; x.font = '600 40px Fredoka, sans-serif'; x.textAlign = 'center';
  x.fillText('My Princess ✨', 300, 940);
  return await new Promise(r => c.toBlob(r, 'image/png'));
}
async function showPhoto() {
  let blob = null;
  try { blob = await princessPhoto(); } catch (e) { blob = null; }
  if (!blob) { toast('這台平板做不出照片'); return; }
  const url = URL.createObjectURL(blob);
  const file = new File([blob], '我的公主.png', { type: 'image/png' });
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  const canCopy = !!(navigator.clipboard && window.ClipboardItem);
  const d = document.createElement('div');
  d.className = 'rest photo';
  d.innerHTML = `<div class="card">
      <h2 class="title-zh">公主照片</h2>
      <img class="photo-img" src="${url}" alt="公主照片">
      <p class="note zh">也可以長按照片，選「儲存」或「拷貝」</p>
      <div class="row">
        ${canShare ? '<button class="btn" id="phShare">📤 <span class="zh">分享</span></button>' : ''}
        <button class="btn soft" id="phSave">⬇️ <span class="zh">存成圖片</span></button>
        ${canCopy ? '<button class="btn soft" id="phCopy">📋 <span class="zh">複製</span></button>' : ''}
        <button class="btn soft" id="phClose"><span class="zh">關掉</span></button>
      </div>
    </div>`;
  document.body.appendChild(d);
  const close = () => { d.remove(); URL.revokeObjectURL(url); };
  d.querySelector('#phClose').addEventListener('click', close);
  d.querySelector('#phSave').addEventListener('click', async () => {
    const r = await saveFile('我的公主.png', blob);
    if (r === 'saved') toast('照片存好了');
    else if (r === 'failed') toast('這裡不能存，請長按照片儲存');
  });
  if (canShare) d.querySelector('#phShare').addEventListener('click', async () => {
    try { await navigator.share({ files: [file], title: '我的公主' }); } catch (e) { if (e && e.name !== 'AbortError') toast('這裡不能分享，請長按照片儲存'); }
  });
  if (canCopy) d.querySelector('#phCopy').addEventListener('click', async () => {
    try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); toast('照片複製好了，可以貼上'); }
    catch (e) { toast('這裡不能複製，請長按照片拷貝'); }
  });
}

/* ---------- play time: rest the eyes after S.limitMin minutes ---------- */
let lastTick = Date.now();
let resting = false;
function tick() {
  const now = Date.now();
  const dt = now - lastTick;
  lastTick = now;
  if (resting || !S.limitMin || document.visibilityState !== 'visible' || dt > 60000) return;
  S.playMs += dt; S.lastSeen = now;
  const limit = S.limitMin * 60000;
  if (!S.warned && S.playMs >= limit - 60000) { S.warned = true; toast('再玩一分鐘，就要讓眼睛休息喔'); }
  save();
  if (S.playMs >= limit) startRest();
}
function startRest() {
  S.restUntil = Date.now() + S.restMin * 60000;
  S.playMs = 0; S.warned = false; save();
  showRest(true);
}
function endRest() {
  resting = false; S.restUntil = 0; S.playMs = 0; S.lastSeen = Date.now(); save();
  const r = $('#rest'); if (r) r.remove();
  lastTick = Date.now();
  go('home');
}
function showRest(announce) {
  resting = true; RUN++;
  try { speechSynthesis.cancel(); } catch (e) {}
  let r = $('#rest');
  if (!r) { r = document.createElement('div'); r.id = 'rest'; r.className = 'rest'; document.body.appendChild(r); }
  r.innerHTML = `<div class="card">
      ${princess('sleepy', 'lg')}
      <h2 class="title-zh">玩了 ${S.limitMin} 分鐘，讓眼睛休息一下</h2>
      <div class="tips">
        <div class="tip zh"><b>🌳</b>看看窗外遠的地方</div>
        <div class="tip zh"><b>😌</b>閉上眼睛數到十</div>
        <div class="tip zh"><b>🤸</b>站起來動一動</div>
        <div class="tip zh"><b>💧</b>喝一杯水</div>
      </div>
      <div class="say-zh zh" id="restLeft"></div>
      <button class="btn big mint" id="restDone" disabled><span class="zh">休息好了，繼續玩</span></button>
      <button class="btn soft" id="restParent">🔑 <span class="zh">家長解鎖</span></button>
      <div id="restGate" class="row"></div>
    </div>`;
  const update = () => {
    if (!$('#rest')) return;
    const left = S.restUntil - Date.now();
    const btn = $('#restDone');
    if (left <= 0) { $('#restLeft').textContent = '休息好了！眼睛亮晶晶 ✨'; btn.disabled = false; return; }
    $('#restLeft').textContent = `再休息 ${Math.ceil(left / 60000)} 分鐘，就可以繼續玩`;
    setTimeout(update, 5000);
  };
  update();
  $('#restDone').addEventListener('click', () => { if (Date.now() >= S.restUntil) endRest(); });
  $('#restParent').addEventListener('click', () => {
    const a = 6 + Math.floor(Math.random() * 4), b = 6 + Math.floor(Math.random() * 4);
    $('#restGate').innerHTML = `<label class="zh" for="gateIn">家長請回答：${a} × ${b} =</label>
      <input class="field" id="gateIn" inputmode="numeric" autocomplete="off" style="width:110px">
      <button class="btn" id="gateOk"><span class="zh">解鎖</span></button>`;
    $('#gateOk').addEventListener('click', () => {
      if (+$('#gateIn').value === a * b) endRest(); else { $('#gateIn').value = ''; toast('答案不對，再試一次'); }
    });
  });
  if (announce) zhSay(`玩了${S.limitMin}分鐘，讓眼睛休息一下，看看窗外遠的地方。`);
}
document.addEventListener('visibilitychange', () => { lastTick = Date.now(); });
setInterval(tick, 5000);

// a long enough break away from the game counts as rest
if (S.lastSeen && Date.now() - S.lastSeen > S.restMin * 60000) { S.playMs = 0; S.warned = false; save(); }
if (S.restUntil > Date.now()) showRest(false);
else { if (S.restUntil) { S.restUntil = 0; S.playMs = 0; save(); } home(); }
</script>
